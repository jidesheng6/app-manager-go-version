# App Manager Go v1 配置文件示例

# 项目配置
project:
  # 项目根目录
  root_dir: "/opt/app-manager"
  
  # 后端应用目录
  backend_dir: "project_backend"
  
  # 前端应用目录
  frontend_dir: "project_frontend"
  
  # 备份目录
  backup_dir: "project_backup"
  
  # 更新目录
  update_dir: "project_update"
  
  # 缓存目录
  cache_dir: "project_cache"

# Java 配置
java:
  # Java 可执行文件路径
  java_path: "/usr/bin/java"
  
  # 默认 JVM 参数
  default_jvm_args: "-Xms512m -Xmx1024m -XX:+UseG1GC -XX:+UseStringDeduplication"
  
  # 应用特定的 JVM 参数
  app_jvm_args:
    "party-gateway": "-Xms1024m -Xmx2048m -XX:+UseG1GC"
    "party-auth": "-Xms512m -Xmx1024m -XX:+UseParallelGC"
    "party-manage-backend": "-Xms1024m -Xmx1536m -XX:+UseG1GC"

# 日志配置
logging:
  # 日志级别 (debug, info, warn, error)
  level: "info"
  
  # 日志文件路径
  file: "/var/log/app-manager/app-manager.log"
  
  # 控制台输出
  console: true
  
  # 日志格式 (text, json)
  format: "text"
  
  # 日志轮转配置
  rotation:
    # 最大文件大小
    max_size: "100MB"
    
    # 保留文件数量
    max_files: 10
    
    # 轮转周期 (daily, weekly, monthly)
    period: "daily"
    
    # 压缩旧日志文件
    compress: true

# 应用日志轮转配置
app_log_rotation:
  # 启用应用日志轮转
  enabled: true
  
  # 默认轮转配置
  default:
    max_size: "50MB"
    max_files: 5
    period: "daily"
    compress: true
  
  # 应用特定配置
  apps:
    "party-gateway":
      max_size: "100MB"
      max_files: 10
      period: "daily"
    "party-auth":
      max_size: "50MB"
      max_files: 7
      period: "daily"

# 备份配置
backup:
  # 自动备份
  auto_backup: true
  
  # 备份保留天数
  retention_days: 30
  
  # 备份压缩
  compression: true
  
  # 备份时排除的文件模式
  exclude_patterns:
    - "*.log"
    - "*.pid"
    - "*.tmp"
    - ".DS_Store"
    - "Thumbs.db"
  
  # 备份前钩子脚本
  pre_backup_script: ""
  
  # 备份后钩子脚本
  post_backup_script: ""

# 监控配置
monitoring:
  # 启用监控
  enabled: true
  
  # 检查间隔（秒）
  interval: 30
  
  # 内存使用率阈值（百分比）
  memory_threshold: 80
  
  # CPU使用率阈值（百分比）
  cpu_threshold: 80
  
  # 磁盘使用率阈值（百分比）
  disk_threshold: 85
  
  # 进程检查超时（秒）
  process_timeout: 10
  
  # 告警配置
  alerts:
    # 启用告警
    enabled: true
    
    # 告警方式 (log, email, webhook)
    methods: ["log"]
    
    # 邮件配置
    email:
      smtp_host: "smtp.example.com"
      smtp_port: 587
      username: "alert@example.com"
      password: "password"
      to: ["admin@example.com"]
    
    # Webhook配置
    webhook:
      url: "https://hooks.example.com/alert"
      timeout: 10

# 应用配置
applications:
  # 应用启动超时（秒）
  startup_timeout: 60
  
  # 应用停止超时（秒）
  shutdown_timeout: 30
  
  # 强制停止超时（秒）
  force_kill_timeout: 10
  
  # 健康检查配置
  health_check:
    # 启用健康检查
    enabled: true
    
    # 检查间隔（秒）
    interval: 30
    
    # 检查超时（秒）
    timeout: 10
    
    # 失败重试次数
    retries: 3
  
  # 应用特定配置
  configs:
    "party-gateway":
      startup_timeout: 120
      health_check_url: "http://localhost:8080/actuator/health"
      environment:
        SPRING_PROFILES_ACTIVE: "prod"
        SERVER_PORT: "8080"
    
    "party-auth":
      startup_timeout: 90
      health_check_url: "http://localhost:8081/actuator/health"
      environment:
        SPRING_PROFILES_ACTIVE: "prod"
        SERVER_PORT: "8081"
    
    "party-manage-backend":
      startup_timeout: 90
      health_check_url: "http://localhost:8082/actuator/health"
      environment:
        SPRING_PROFILES_ACTIVE: "prod"
        SERVER_PORT: "8082"

# Systemd 集成配置
systemd:
  # 启用 Systemd 集成
  enabled: true
  
  # 服务文件目录
  service_dir: "/etc/systemd/system"
  
  # 服务用户
  user: "root"
  
  # 服务组
  group: "root"
  
  # 服务重启策略
  restart_policy: "on-failure"
  
  # 重启延迟（秒）
  restart_delay: 5

# 安全配置
security:
  # 启用安全模式
  enabled: true
  
  # 允许的用户
  allowed_users: ["root", "app-manager"]
  
  # 文件权限
  file_permissions:
    config: "0600"
    logs: "0644"
    binaries: "0755"
  
  # 进程权限检查
  process_check: true

# 性能配置
performance:
  # 并发操作数
  max_concurrent_operations: 5
  
  # 操作超时（秒）
  operation_timeout: 300
  
  # 内存限制（MB）
  memory_limit: 1024
  
  # 临时文件清理
  temp_cleanup:
    enabled: true
    interval: "1h"
    max_age: "24h"

# 网络配置
network:
  # HTTP 超时（秒）
  http_timeout: 30
  
  # 连接超时（秒）
  connect_timeout: 10
  
  # 代理配置
  proxy:
    enabled: false
    http_proxy: ""
    https_proxy: ""
    no_proxy: "localhost,127.0.0.1"

# 开发配置
development:
  # 启用开发模式
  enabled: false
  
  # 详细日志
  verbose_logging: true
  
  # 调试端口
  debug_port: 8888
  
  # 热重载
  hot_reload: false

# 实验性功能
experimental:
  # 启用实验性功能
  enabled: false
  
  # 功能列表
  features:
    - "auto_scaling"
    - "container_support"
    - "cluster_mode"